[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name             tail
    Tag              keycloak.audit
    Path             /var/log/keycloak/*.log
    Parser           json
    Refresh_Interval 2
    Mem_Buf_Limit    5MB
    Skip_Long_Lines  On

[FILTER]
    Name    record_modifier
    Match   keycloak.audit
    Record  environment  production-zero-trust
    Record  log_source   keycloak_iam

# Wazuh Syslog Shipper Output (Optional Live Wazuh Manager forwarding)
[OUTPUT]
    Name          syslog
    Match         keycloak.audit
    Host          ${WAZUH_MANAGER_IP}
    Port          ${WAZUH_SYSLOG_PORT}
    Mode          udp
    Syslog_Format rfc5424
    Syslog_App_Name keycloak-iam

# Local Audit Trail Output for inspection and archiving
[OUTPUT]
    Name  file
    Match *
    Path  /var/log/audit-output/
    File  keycloak-audit-events.json
    Format json_lines
