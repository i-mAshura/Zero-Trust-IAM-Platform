server:
  port: 8081

spring:
  application:
    name: spring-boot-resource-server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/zero-trust-realm
          jwk-set-uri: http://localhost:8080/realms/zero-trust-realm/protocol/openid-connect/certs

logging:
  level:
    org.springframework.security: DEBUG
